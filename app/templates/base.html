<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}水库公示表格采集{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('index') }}">💧 水库公示表格采集</a>
  <span class="subtitle">合并单元格 → 可入库观测记录</span>
  <nav class="topnav">
    <a href="{{ url_for('index') }}">采集</a>
    <a href="{{ url_for('deliveries') }}">入库发送记录</a>
  </nav>
</header>
<main class="container">
{% block body %}{% endblock %}
</main>
<footer class="footer">
  坐标按原表行序及行内单元格序从 1 计数（R行C列）· 表头支持顶部 1～3 行
</footer>
</body>
</html>
